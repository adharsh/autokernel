[project]
name = "autokernel"
version = "0.1.0"
description = "Autonomous GPU kernel optimization with multi-agent experimentation"
requires-python = ">=3.10"
dependencies = [
    # Core
    "torch==2.9.1",
    "triton>=3.3.0",
    "numpy>=2.2.0",
    # CUDA Python bindings (PTX, NVRTC, driver API)
    "cuda-python>=12.6.0",
    # CUTLASS Python (CUTE DSL)
    "nvidia-cutlass>=3.6.0",
    # Profiling & analysis
    "matplotlib>=3.10.0",
    "pandas>=2.2.0",
    # CUDA C++ build (ninja for fast compilation)
    "ninja>=1.11.0",
    "pybind11>=2.13.0",
    # Misc
    "tabulate>=0.9.0",
    "setuptools>=82.0.1",
]

[tool.uv.sources]
torch = [
    { index = "pytorch-cu128" },
]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
